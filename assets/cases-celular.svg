<title>Cases: Tecnologia base, IoT sensores alimentados por energia solar; ALMA, DFT+ML simulação computacional e machine learning; ai-PLANTA, 2027 lançamento previsto; ai-AGUAS, H₂O monitoramento de parâmetros de qualidade da água</title>
<style>
