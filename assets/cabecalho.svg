<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1D98A"/><stop offset="1" stop-color="#9C7A1E"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
</defs>
<defs><linearGradient id="hb" x1="0" x2="1"><stop offset="0" stop-color="#F1D98A"/><stop offset="1" stop-color="#9C7A1E"/></linearGradient><filter id="hs" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#000" flood-opacity=".45"/></filter></defs><path d="M0 0H860V150C740 182 610 118 470 146C330 174 190 120 0 152Z" fill="url(#hb)"/><path d="M0 152C190 120 330 174 470 146C610 118 740 182 860 150V164C730 196 600 140 470 162C330 186 180 140 0 170Z" fill="url(#hb)" opacity=".35"/><g class="up"><text x="430.0" y="86" text-anchor="middle" filter="url(#hs)" style="font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF">Lucas Viana Costa</text><text x="430.0" y="122" text-anchor="middle" style="font:700 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#15803D">cientista e empreendedor</text></g>
